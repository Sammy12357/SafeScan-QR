<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
  <title>Confirm sign out | SafeScan QR</title>
  <link rel="stylesheet" href="/static/styles.css?v=rose-theme-v1">
</head>
<body>
  <main class="page-shell" style="max-width: 36rem; padding-top: 5rem;">
    <section class="card" style="padding: 2rem;">
      <h1>Confirm sign out</h1>
      <p>Sign out of SafeScan on this device?</p>
      <form action="/auth/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
        <button class="primary-button" type="submit">Sign out</button>
        <a class="secondary-button" href="/profile">Cancel</a>
      </form>
    </section>
  </main>
</body>
</html>
