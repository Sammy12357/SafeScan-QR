<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | SafeScan QR</title>
  <link rel="stylesheet" href="/static/styles.css?v=light-theme-v2">
</head>
<body>
  <div class="page-shell legal-shell">
    <section class="legal-document">

      <h1>{{ title }}</h1>
      {% if message %}<div class="request-message">{{ message }}</div>{% endif %}
      {{ body_html | safe }}
    </section>
  </div>
</body>
</html>
