version: "3.9"

services:
  app:
    build:
      context: .
      target: runtime
    image: safescan-qr:local
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MOCK_MODE=true
      - SAFESCAN_ML_ENABLED=false
      - STORAGE_BACKEND=local
      - METRICS_ALLOWED_IPS=127.0.0.1,::1
      - AIRDROP_ENABLED=false
      - SOLANA_MAINNET_ENABLED=false
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  app_staging:
    build:
      context: .
      target: runtime
    image: safescan-qr:staging
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - MOCK_MODE=false
      - SAFESCAN_ML_ENABLED=true
      - STORAGE_BACKEND=local
      - METRICS_ALLOWED_IPS=127.0.0.1,::1
      - AIRDROP_ENABLED=false
      - SOLANA_MAINNET_ENABLED=false
    volumes:
      - db_staging:/app/data
    restart: unless-stopped
    profiles:
      - staging

volumes:
  db_data:
  db_staging:
