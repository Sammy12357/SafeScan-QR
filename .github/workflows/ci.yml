name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/safescan_ci.db
      APP_URL: https://testserver
      MOCK_MODE: "false"
      SAFESCAN_ML_ENABLED: "false"
      AIRDROP_ENABLED: "false"
      SOLANA_MAINNET_ENABLED: "false"
      AIRDROP_DRY_RUN: "true"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Check dependency locks
        run: python scripts/check_dependency_locks.py
      - name: Check installed runtime imports
        run: |
          python -m pip check
          python - <<'PY'
          import cv2
          import h5py
          import keras
          import sklearn
          import tensorflow
          import zxingcpp
          from PIL import Image
          from solana.rpc.async_api import AsyncClient
          from solders.keypair import Keypair
          from solders.message import MessageV0
          from solders.pubkey import Pubkey
          from solders.transaction import VersionedTransaction
          print("Runtime imports passed")
          PY
      - name: Syntax check
        run: python -m py_compile hackabull/*.py scripts/security/identity_dry_run.py scripts/security/backup_sqlite.py db.py private_files.py distribute.py scrop.py storage.py ml_model_final.py
      - name: Run tests
        run: python -m pytest tests -q
      - name: Check browser worker against the QR corpus
        run: |
          npm ci --prefix scripts/qr_bench
          node scripts/qr_bench/test_worker.mjs 16
          node scripts/qr_bench/test_camera_controls.mjs
          node scripts/test_consent_ui.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Audit hashed runtime and test locks
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --require-hashes -r requirements.lock --progress-spinner off
          pip-audit --require-hashes -r requirements-dev.lock --progress-spinner off

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Reject changes to reviewed Bandit findings
        run: |
          python -m pip install bandit==1.9.4
          set +e
          bandit -r hackabull -ll -f json -o /tmp/bandit.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python scripts/check_bandit_baseline.py /tmp/bandit.json .github/security/bandit-baseline.json

  semgrep:
    runs-on: ubuntu-latest
    env:
      SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Reject new high-severity code findings
        run: |
          python -m pip install semgrep==1.185.0
          base=$(bash scripts/security_diff_base.sh)
          semgrep scan --error --severity ERROR --config p/python --config p/fastapi --config p/secrets --config .github/security/semgrep-redos.yml --baseline-commit "$base" .

  gitleaks:
    runs-on: ubuntu-latest
    env:
      SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan every new commit for secrets
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          base=$(bash scripts/security_diff_base.sh)
          /tmp/gitleaks git --log-opts="$base..HEAD" --redact --no-banner .
